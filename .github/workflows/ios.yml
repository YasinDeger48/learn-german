name: iPhone IPA
# Manual only: macOS minutes are expensive. TestFlight is the normal way to install;
# run this only when you need a sideload IPA or a quick compile check.
on:
  workflow_dispatch:

concurrency:
  group: ios-ipa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package
        shell: bash
        run: |
          set -euo pipefail
          app=Payload/Almanca.app
          mkdir -p "$app"
          plutil -lint Info.plist
          cp Info.plist "$app/"
          # Resources are copied flat into the bundle, like Xcode does for groups.
          find Resources -type f \( -name '*.json' -o -name '*.ttf' -o -name '*.png' -o -name '*.jpg' \) -exec cp {} "$app/" \;
          swift_sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          find Sources -name '*.swift' -print0 | xargs -0 xcrun --sdk iphoneos swiftc -parse-as-library -O \
            -target arm64-apple-ios16.0 -sdk "$swift_sdk" -o "$app/Almanca"
          sips -z 180 180 AppIcon.png --out "$app/AppIcon@3x.png"
          sips -z 120 120 AppIcon.png --out "$app/AppIcon@2x.png"
          ditto -c -k --keepParent Payload Deschly.ipa
          unzip -t Deschly.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Deschly-IPA
          path: Deschly.ipa
          if-no-files-found: error
