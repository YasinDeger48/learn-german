name: iPhone IPA
on:
  push:
    paths:
      - '.github/workflows/ios.yml'
      - '*.swift'
      - 'a1.json'
      - 'AppIcon.png'
      - 'Info.plist'
      - 'lessons.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package
        shell: bash
        run: |
          set -euo pipefail
          app=Payload/Almanca.app
          mkdir -p "$app"
          plutil -lint Info.plist
          cp Info.plist lessons.json a1.json "$app/"
          swift_sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -parse-as-library -O \
            -target arm64-apple-ios16.0 -sdk "$swift_sdk" \
            Almanca.swift A1.swift -o "$app/Almanca"
          sips -z 180 180 AppIcon.png --out "$app/AppIcon@3x.png"
          sips -z 120 120 AppIcon.png --out "$app/AppIcon@2x.png"
          ditto -c -k --keepParent Payload Almanca-Derslerim.ipa
          unzip -t Almanca-Derslerim.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Almanca-Derslerim-IPA
          path: Almanca-Derslerim.ipa
          if-no-files-found: error
