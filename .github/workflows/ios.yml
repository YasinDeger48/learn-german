name: iPhone IPA
# Compile check on every push, with the same Xcode project and Xcode as TestFlight (XcodeGen + xcodebuild),
# so Swift packages (Google Mobile Ads) build here too. Also makes an unsigned IPA (for Sideloadly).
# Free while the repository is public.
# If the repository becomes private again, remove the "push" trigger: private macOS minutes count 10×.
on:
  push:
    paths:
      - '.github/workflows/ios.yml'
      - 'ci/**'
      - 'project.yml'
      - 'Sources/**'
      - 'Tests/**'
      - 'Widgets/**'
      - 'Resources/**'
      - 'Info.plist'
  workflow_dispatch:

concurrency:
  group: ios-ipa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Xcode project
        shell: bash
        run: bash ci/prepare_project.sh "${{ github.run_number }}"

      - name: Build (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          if ! xcodebuild build \
            -project Almanca.xcodeproj -scheme Almanca -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            echo "::group::Errors"; grep -E 'error:' build.log | sort -u | head -60 || true; echo "::endgroup::"
            tail -n 60 build.log
            exit 1
          fi
          grep -E 'warning:' build.log | grep '/Sources/' | sort -u | head -40 || true
          tail -n 3 build.log

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          app=build/Build/Products/Release-iphoneos/Almanca.app
          test -d "$app"
          mkdir -p Payload
          cp -R "$app" Payload/
          ditto -c -k --keepParent Payload Deschly.ipa
          unzip -t Deschly.ipa > /dev/null
          du -h Deschly.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Deschly-IPA
          path: Deschly.ipa
          if-no-files-found: error

      # After the IPA, so a failing test never blocks it; the run still turns red.
      - name: Tests (simulator)
        shell: bash
        run: |
          set -euo pipefail
          # Info.plist names iPhoneOS by hand; for the simulator Xcode would then refuse the embedded widget
          # ("built for iOS but contains embedded content built for the iOS platform"). Only this runner's copy,
          # after the IPA: Xcode fills the key itself for each platform.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleSupportedPlatforms" Info.plist || true
          device=$(xcrun simctl list devices available -j | python3 -c "import json, sys; d = json.load(sys.stdin)['devices']; print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator $device"
          if ! xcodebuild test \
            -project Almanca.xcodeproj -scheme Almanca -destination "id=$device" \
            -derivedDataPath build-tests CODE_SIGNING_ALLOWED=NO > test.log 2>&1; then
            echo "::group::Failures"; grep -E 'error:|failed|XCTAssert' test.log | sort -u | head -40 || true; echo "::endgroup::"
            tail -n 40 test.log
            exit 1
          fi
          grep -E 'Executed [0-9]+ test' test.log | tail -n 1
