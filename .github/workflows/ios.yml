name: iPhone IPA
# Compile check on every push, with the same Xcode project and Xcode as TestFlight (XcodeGen + xcodebuild),
# so Swift packages (Google Mobile Ads) build here too. Also makes an unsigned IPA (for Sideloadly).
# Free while the repository is public.
# If the repository becomes private again, remove the "push" trigger: private macOS minutes count 10×.
on:
  push:
    paths:
      - '.github/workflows/ios.yml'
      - 'ci/**'
      - 'project.yml'
      - 'Sources/**'
      - 'Tests/**'
      - 'Widgets/**'
      - 'Resources/**'
      - 'Info.plist'
  workflow_dispatch:

concurrency:
  group: ios-ipa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Xcode project
        shell: bash
        run: bash ci/prepare_project.sh "${{ github.run_number }}"

      - name: Build (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          if ! xcodebuild build \
            -project Almanca.xcodeproj -scheme Almanca -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            echo "::group::Errors"; grep -E 'error:' build.log | sort -u | head -60 || true; echo "::endgroup::"
            tail -n 60 build.log
            exit 1
          fi
          grep -E 'warning:' build.log | grep '/Sources/' | sort -u | head -40 || true
          tail -n 3 build.log

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          app=build/Build/Products/Release-iphoneos/Almanca.app
          test -d "$app"
          mkdir -p Payload
          cp -R "$app" Payload/
          ditto -c -k --keepParent Payload Deschly.ipa
          unzip -t Deschly.ipa > /dev/null
          du -h Deschly.ipa
          # A second IPA from the same build with Pro and ads on (DeschlyFreeForAll off), to see the free
          # version: only the copied app's Info.plist changes (the IPA is unsigned; Sideloadly signs it).
          # Sideloaded builds always get Google's test ads.
          rm -rf pro && mkdir -p pro/Payload
          cp -R "$app" pro/Payload/
          /usr/libexec/PlistBuddy -c "Set :DeschlyFreeForAll false" pro/Payload/Almanca.app/Info.plist
          # Sample prices on the paywall while App Store Connect has no products (ProPreview in ProViews.swift).
          /usr/libexec/PlistBuddy -c "Add :DeschlyPreviewPrices bool true" pro/Payload/Almanca.app/Info.plist
          (cd pro && ditto -c -k --keepParent Payload ../Deschly-Pro-Reklam.ipa)
          unzip -t Deschly-Pro-Reklam.ipa > /dev/null
          du -h Deschly-Pro-Reklam.ipa
          # A third IPA for App Store screenshots: the free build with sample progress filled at the first
          # launch (5-day streak, A1 units 1-2, a passed A1 exam, a few mistakes; DemoData.swift).
          rm -rf demo && mkdir -p demo/Payload
          cp -R "$app" demo/Payload/
          /usr/libexec/PlistBuddy -c "Add :DeschlyDemoData bool true" demo/Payload/Almanca.app/Info.plist
          (cd demo && ditto -c -k --keepParent Payload ../Deschly-Ekran-Demo.ipa)
          unzip -t Deschly-Ekran-Demo.ipa > /dev/null
          du -h Deschly-Ekran-Demo.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Deschly-IPA
          path: Deschly.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Deschly-Pro-Reklam-IPA
          path: Deschly-Pro-Reklam.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Deschly-Ekran-Demo-IPA
          path: Deschly-Ekran-Demo.ipa
          if-no-files-found: error

      # After the IPA, so a failing test never blocks it; the run still turns red.
      - name: Tests (simulator)
        shell: bash
        run: |
          set -euo pipefail
          # Info.plist names iPhoneOS by hand; for the simulator Xcode would then refuse the embedded widget
          # ("built for iOS but contains embedded content built for the iOS platform"). Only this runner's copy,
          # after the IPA: Xcode fills the key itself for each platform.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleSupportedPlatforms" Info.plist || true
          device=$(xcrun simctl list devices available -j | python3 -c "import json, sys; d = json.load(sys.stdin)['devices']; print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator $device"
          if ! xcodebuild test \
            -project Almanca.xcodeproj -scheme Almanca -destination "id=$device" \
            -derivedDataPath build-tests CODE_SIGNING_ALLOWED=NO > test.log 2>&1; then
            echo "::group::Failures"; grep -E 'error:|failed|XCTAssert' test.log | sort -u | head -40 || true; echo "::endgroup::"
            tail -n 40 test.log
            exit 1
          fi
          grep -E 'Executed [0-9]+ test' test.log | tail -n 1
