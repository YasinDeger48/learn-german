# XcodeGen project, generated on the macOS runner by .github/workflows/testflight.yml
name: Almanca
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
targets:
  Almanca:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "**/*.txt"
          # Only A1 covers ship inside the app; A2–B2 come from the website (tools/publish_content.py).
          - "Covers/a2-*.jpg"
          - "Covers/b1-*.jpg"
          - "Covers/b2-*.jpg"
      - path: Assets.xcassets
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - target: DeschlyWidgets
    settings:
      base:
        PRODUCT_NAME: Almanca
        PRODUCT_BUNDLE_IDENTIFIER: com.yasindeger.almanca
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: ["-ObjC"]
    scheme:
      testTargets:
        - AlmancaTests
  AlmancaTests:
    # Unit tests (Tests/), run on a simulator by .github/workflows/ios.yml after the IPA is made.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Almanca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasindeger.almanca.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
  DeschlyWidgets:
    # Lock Screen and Home Screen widgets (iOS 17+; on iOS 16 the app works without them).
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: DeschlyWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.yasindeger.almanca.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
