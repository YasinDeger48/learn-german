<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deschly Studio</title>
<style>
  :root {
    --bg: #f5f5f2; --panel: #ffffff; --ink: #16171a; --muted: #6b6f76; --line: #e3e3de;
    --accent: #2f5bea; --ok: #157a41; --fix: #b7791f; --bad: #c8323a; --chip: #eef0f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121315; --panel: #1b1c1f; --ink: #ececea; --muted: #9a9ea6; --line: #2c2e33;
            --accent: #6d8cff; --ok: #3fbf74; --fix: #e3a73d; --bad: #ff6b6b; --chip: #24262b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  header h1 b { color: var(--accent); }
  .levels { display: flex; gap: 6px; flex-wrap: wrap; }
  .lv { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; }
  .lv small { color: var(--muted); margin-left: 6px; }
  a.lv { text-decoration: none; }
  .lv.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .spacer { flex: 1; }
  button.main { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button.main:disabled { opacity: .45; cursor: default; }
  button.plain { background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font: inherit; cursor: pointer; }
  main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .chip { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 3px 10px; cursor: pointer; font: inherit; color: var(--ink); font-size: 12px; }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--chip); }
  .row.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .thumb { width: 72px; height: 48px; border-radius: 6px; object-fit: cover; background: var(--chip); display: grid; place-items: center; color: var(--muted); font-size: 11px; }
  .row .t { font-weight: 600; }
  .row .m { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.fix { background: var(--fix); } .dot.none { background: var(--line); }
  .warn { color: var(--bad); }
  section.detail { overflow: auto; padding: 16px 20px 60px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .top { display: grid; grid-template-columns: minmax(280px, 480px) 1fr; gap: 20px; align-items: start; }
  .drop { position: relative; border: 2px dashed var(--line); border-radius: 12px; aspect-ratio: 3 / 2; display: grid; place-items: center; overflow: hidden; background: var(--panel); }
  .drop img { width: 100%; height: 100%; object-fit: cover; }
  .drop.hover { border-color: var(--accent); }
  .drop .hint { color: var(--muted); text-align: center; padding: 16px; }
  .coverbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .coverbar label { color: var(--muted); font-size: 12px; }
  h2 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); margin-bottom: 10px; }
  .issues { margin: 8px 0; padding: 0; list-style: none; }
  .issues li { color: var(--bad); font-size: 13px; }
  .issues li::before { content: "⚠ "; }
  .review { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .review textarea { width: 100%; min-height: 54px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--panel); color: var(--ink); font: inherit; }
  .btn-ok { background: var(--ok); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .btn-fix { background: var(--fix); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .status { font-size: 12px; color: var(--muted); }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card p { margin: 0 0 8px; }
  mark { background: color-mix(in srgb, var(--accent) 18%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
  table { width: 100%; border-collapse: collapse; }
  td { border-top: 1px solid var(--line); padding: 5px 4px; vertical-align: top; }
  td:first-child { font-weight: 600; white-space: nowrap; }
  .q { margin-bottom: 10px; }
  .q ol { margin: 4px 0 0 18px; padding: 0; }
  .q li.right { color: var(--ok); font-weight: 600; }
  .prompt { white-space: pre-wrap; font-size: 12px; color: var(--muted); max-height: 140px; overflow: auto; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80vw; }
  .toast.show { opacity: 1; }
  .keys { color: var(--muted); font-size: 12px; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } .top { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } aside { max-height: 45vh; } }
</style>
</head>
<body>
<header>
  <h1>deschly<b>.</b> studio</h1>
  <nav class="levels"><a class="lv" href="/">← New Studio</a><a class="lv on" href="/classic">Texts</a><a class="lv" href="/classic/inbox">ChatGPT inbox · Units · Publish</a></nav>
  <div class="levels" id="levels"></div>
  <div class="spacer"></div>
  <button class="plain" id="prompts">Copy prompts for missing covers</button>
  <button class="main" id="save" disabled>Save changes</button>
</header>
<main>
  <aside>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </aside>
  <section class="detail" id="detail"><div class="empty">Choose a text on the left.</div></section>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { level: 'A1', filter: 'all', list: [], current: null, bust: Date.now() };
const FILTERS = [['all','All'],['nocover','No cover'],['issues','Issues'],['open','Not reviewed'],['fix','To fix'],['ok','Approved']];

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
async function api(path, opts) { const r = await fetch(path, opts); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }

async function loadSummary() {
  const s = await api('/api/summary');
  $('#levels').innerHTML = s.levels.map(l =>
    `<button class="lv ${l.level === state.level ? 'on' : ''}" data-level="${l.level}">${l.level}<small>${l.covers}/${l.texts} covers · ${l.ok} ok${l.fix ? ' · ' + l.fix + ' fix' : ''}</small></button>`).join('');
  $('#save').disabled = !s.changes;
  $('#save').textContent = s.changes ? `Save changes (${s.changes})` : 'Saved';
}

async function loadList() {
  state.list = await api('/api/texts/' + state.level);
  renderList();
}

function visible() {
  return state.list.filter(t => {
    const st = t.review.status;
    switch (state.filter) {
      case 'nocover': return !t.cover;
      case 'issues': return t.issues.length > 0;
      case 'open': return !st;
      case 'fix': return st === 'fix';
      case 'ok': return st === 'ok';
      default: return true;
    }
  });
}

function renderList() {
  $('#filters').innerHTML = FILTERS.map(([k, n]) => `<button class="chip ${k === state.filter ? 'on' : ''}" data-filter="${k}">${n}</button>`).join('');
  const rows = visible();
  $('#list').innerHTML = rows.length ? rows.map(t => `
    <div class="row ${state.current === t.id ? 'on' : ''}" data-id="${t.id}">
      ${t.cover ? `<img class="thumb" loading="lazy" src="/cover/${t.id}.jpg?v=${state.bust}" alt="">` : '<div class="thumb">no cover</div>'}
      <div><div class="t">${esc(t.title)}</div>
        <div class="m"><span class="dot ${t.review.status || 'none'}"></span>${t.id} · ${esc(t.topic)}${t.issues.length ? ` · <span class="warn">${t.issues.length} issue${t.issues.length > 1 ? 's' : ''}</span>` : ''}</div></div>
    </div>`).join('') : '<div class="empty">Nothing here.</div>';
}

function highlight(text, glossary) {
  let html = esc(text);
  const forms = [...new Set(glossary.map(g => g.form))].sort((a, b) => b.length - a.length);
  for (const f of forms) html = html.replace(new RegExp(`(^|[^\\p{L}])(${f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=[^\\p{L}]|$)`, 'u'), '$1<mark>$2</mark>');
  return html;
}

async function openText(id) {
  state.current = id;
  history.replaceState(null, '', '#' + id);
  renderList();
  const d = await api('/api/text/' + id);
  const t = d.text, trans = t.trans || [];
  const part = lang => trans.map(x => x[lang]).filter(Boolean).map(x => `<p>${esc(x)}</p>`).join('') || '<p>—</p>';
  const qs = t.questions.map((q, i) => {
    const opts = q.type === 'tf' ? ['Richtig', 'Falsch'] : q.options;
    return `<div class="q"><b>${i + 1}.</b> ${esc(q.q)}<ol>${opts.map((o, j) => `<li class="${j === q.answer ? 'right' : ''}">${esc(o)}</li>`).join('')}</ol></div>`;
  }).join('');
  $('#detail').innerHTML = `
    <div class="top">
      <div>
        <div class="drop" id="drop">${d.cover ? `<img src="/cover/${id}.jpg?v=${state.bust}" alt="">` : '<div class="hint">No cover yet.<br>Drop a picture here, paste it (Ctrl+V) or click to choose a file.</div>'}</div>
        <div class="coverbar">
          <button class="plain" id="pick">${d.cover ? 'Replace picture' : 'Choose picture'}</button>
          <label><input type="checkbox" id="crop"> cut caption strip at the top (8%)</label>
          ${d.cover ? '<button class="plain" id="remove">Remove</button>' : ''}
        </div>
        <div class="card" style="margin-top:12px"><h3>Image prompt <button class="plain" id="copyprompt" style="float:right;padding:2px 8px">Copy</button></h3><div class="prompt">${esc(d.prompt)}</div></div>
      </div>
      <div>
        <h2>${esc(t.title)}</h2>
        <div class="sub">${t.id} · ${d.level} · ${esc(t.topic || '')} · ${t.paragraphs.join(' ').split(/\s+/).length} words</div>
        ${d.issues.length ? `<ul class="issues">${d.issues.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : '<div class="status">No automatic issues found.</div>'}
        <div class="review">
          <button class="btn-ok" id="ok">Approve (A)</button>
          <button class="btn-fix" id="fix">Needs a fix (F)</button>
          <button class="plain" id="clear">Clear</button>
          <span class="status">${d.review.status ? `${d.review.status === 'ok' ? 'Approved' : 'To fix'} · ${d.review.at}` : 'Not reviewed'}</span>
          <textarea id="note" placeholder="Note (what to fix, for ChatGPT or for me)">${esc(d.review.note || '')}</textarea>
        </div>
        <div class="keys">← → or J K: previous / next text</div>
      </div>
    </div>
    <div class="cols">
      <div class="card"><h3>Deutsch</h3>${t.paragraphs.map(p => `<p>${highlight(p, t.glossary)}</p>`).join('')}</div>
      <div class="card"><h3>Türkçe</h3>${part('tr')}</div>
      <div class="card"><h3>English</h3>${part('en')}</div>
    </div>
    <div class="cols">
      <div class="card"><h3>Glossary</h3><table>${t.glossary.map(g => `<tr><td>${esc((g.art ? g.art + ' ' : '') + g.lemma)}</td><td>${esc(g.mean.tr)}</td><td>${esc(g.mean.en || '—')}</td></tr>`).join('')}</table></div>
      <div class="card" style="grid-column: span 2"><h3>Questions (correct answer in green)</h3>${qs}</div>
    </div>`;
  const drop = $('#drop');
  drop.onclick = () => $('#file').click();
  $('#pick').onclick = () => $('#file').click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('hover'); };
  drop.ondragleave = () => drop.classList.remove('hover');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('hover'); const f = e.dataTransfer.files[0]; if (f) upload(f); };
  if ($('#remove')) $('#remove').onclick = async () => { if (!confirm('Remove this cover?')) return; await api('/api/cover/' + id, { method: 'DELETE' }); await refresh(); };
  $('#copyprompt').onclick = () => navigator.clipboard.writeText(d.prompt).then(() => toast('Prompt copied'));
  $('#ok').onclick = () => review('ok');
  $('#fix').onclick = () => review('fix');
  $('#clear').onclick = () => review('');
}

async function upload(file) {
  const id = state.current; if (!id) return;
  const crop = $('#crop') && $('#crop').checked ? 0.08 : 0;
  try {
    await api(`/api/cover/${id}?crop_top=${crop}`, { method: 'POST', body: file });
    toast('Cover saved');
    await refresh();
  } catch (e) { toast('Not saved: ' + e.message); }
}

async function review(status) {
  const id = state.current;
  await api('/api/review/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status, note: $('#note').value }) });
  toast(status === 'ok' ? 'Approved' : status === 'fix' ? 'Marked to fix' : 'Cleared');
  const rows = visible(), i = rows.findIndex(t => t.id === id);
  await loadSummary(); await loadList();
  const next = status === 'ok' && rows[i + 1] ? rows[i + 1].id : id;
  openText(next);
}

async function refresh() { state.bust = Date.now(); await loadSummary(); await loadList(); if (state.current) openText(state.current); }

function step(d) {
  const rows = visible(); if (!rows.length) return;
  const i = rows.findIndex(t => t.id === state.current);
  const n = rows[Math.max(0, Math.min(rows.length - 1, i + d))];
  if (n) { openText(n.id); document.querySelector(`.row[data-id="${n.id}"]`)?.scrollIntoView({ block: 'nearest' }); }
}

$('#levels').onclick = async e => { const b = e.target.closest('[data-level]'); if (!b) return; state.level = b.dataset.level; state.current = null; $('#detail').innerHTML = '<div class="empty">Choose a text on the left.</div>'; await loadSummary(); await loadList(); };
$('#filters').onclick = e => { const b = e.target.closest('[data-filter]'); if (!b) return; state.filter = b.dataset.filter; renderList(); };
$('#list').onclick = e => { const r = e.target.closest('[data-id]'); if (r) openText(r.dataset.id); };
$('#file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) upload(f); };
$('#save').onclick = async () => { const r = await api('/api/commit', { method: 'POST' }); toast(r.message); await loadSummary(); };
$('#prompts').onclick = async () => { const r = await api('/api/prompts/' + state.level); await navigator.clipboard.writeText(r.text); toast(`${r.count} prompts for ${state.level} copied`); };
document.addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])][0]; if (f && state.current) upload(f); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'j') step(1);
  else if (e.key === 'ArrowLeft' || e.key === 'k') step(-1);
  else if ((e.key === 'a' || e.key === 'A') && state.current) review('ok');
  else if ((e.key === 'f' || e.key === 'F') && state.current) review('fix');
});
const start = location.hash.slice(1);
if (/^[a-z]\d-\d{3}$/.test(start)) state.level = start.slice(0, 2).toUpperCase();
loadSummary().then(loadList).then(() => { if (state.list.some(t => t.id === start)) openText(start); }).catch(e => toast(e.message));
</script>
</body>
</html>
